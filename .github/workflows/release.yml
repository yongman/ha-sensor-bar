name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric version (for example, 1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Resolve version and release commit
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$(git rev-parse HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$(uname -m)" = arm64
      - name: Run unit and release safety tests
        run: |
          swift test -Xswiftc -warnings-as-errors
          python3 -m unittest discover -s scripts/tests -v
      - name: Build
        run: ./scripts/build-app.sh "$VERSION"
      - name: Package
        run: ./scripts/package-release.sh "$VERSION"
      - name: Verify packages
        run: ./scripts/verify-release.sh "$VERSION"
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Verify artifact and publish complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 scripts/publish-release.py "$VERSION" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
