name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-silicon:
    name: Apple Silicon build, tests, and packages
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Verify toolchain
        run: |
          test "$(uname -m)" = arm64
          swift --version
          xcodebuild -version
      - name: Run unit tests with coverage
        run: swift test --enable-code-coverage -Xswiftc -warnings-as-errors
      - name: Build app
        run: ./scripts/build-app.sh 1.0.0
      - name: Create DMG and ZIP
        run: ./scripts/package-release.sh 1.0.0
      - name: Verify distribution
        run: ./scripts/verify-release.sh 1.0.0
      - name: Render demo and settings smoke test
        run: ./scripts/smoke-test.sh
      - name: Export coverage
        run: |
          xcrun llvm-cov export \
            .build/debug/HASensorBarPackageTests.xctest/Contents/MacOS/HASensorBarPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -format=lcov > dist/coverage.lcov
      - name: Upload packages and preview
        uses: actions/upload-artifact@v4
        with:
          name: HA-Sensor-Bar-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.txt
            dist/*.sha256
            dist/*.png
            dist/*.lcov
          if-no-files-found: error
          retention-days: 14
